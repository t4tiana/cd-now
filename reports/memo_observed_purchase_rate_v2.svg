<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 490" role="img" aria-labelledby="title desc">
<title id="title">Observed purchasing by time since first purchase</title>
<desc id="desc">Share of the original 23,570 Q1 1997 first purchasers buying in each fully observed 30-day window from days 30 through 449. The share declines from 13.1 percent to 6.6 percent.</desc>
<rect width="1040" height="490" fill="#ffffff"/>
<text x="94.0" y="36.0" text-anchor="start" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#17253d">Repeat purchasing continues, but involves fewer customers</text>
<text x="94.0" y="61.0" text-anchor="start" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#475569">Q1 1997 first-purchase cohort; observed through June 30, 1998</text>
<line x1="94" y1="364.0" x2="944" y2="364.0" stroke="#dbe3ed"/>
<text x="82.0" y="369.0" text-anchor="end" font-family="Arial,sans-serif" font-size="12" font-weight="400" fill="#475569">0%</text>
<line x1="94" y1="274.0" x2="944" y2="274.0" stroke="#dbe3ed"/>
<text x="82.0" y="279.0" text-anchor="end" font-family="Arial,sans-serif" font-size="12" font-weight="400" fill="#475569">5%</text>
<line x1="94" y1="184.0" x2="944" y2="184.0" stroke="#dbe3ed"/>
<text x="82.0" y="189.0" text-anchor="end" font-family="Arial,sans-serif" font-size="12" font-weight="400" fill="#475569">10%</text>
<line x1="94" y1="94.0" x2="944" y2="94.0" stroke="#dbe3ed"/>
<text x="82.0" y="99.0" text-anchor="end" font-family="Arial,sans-serif" font-size="12" font-weight="400" fill="#475569">15%</text>
<rect x="103.0" y="128.2" width="42.7" height="235.8" fill="#286c93"/>
<text x="124.4" y="385.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="400" fill="#334155">30–59</text>
<rect x="163.7" y="182.6" width="42.7" height="181.4" fill="#286c93"/>
<rect x="224.4" y="199.9" width="42.7" height="164.1" fill="#286c93"/>
<rect x="285.1" y="202.9" width="42.7" height="161.1" fill="#286c93"/>
<text x="306.5" y="385.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="400" fill="#334155">120–149</text>
<rect x="345.9" y="209.4" width="42.7" height="154.6" fill="#286c93"/>
<rect x="406.6" y="221.3" width="42.7" height="142.7" fill="#286c93"/>
<rect x="467.3" y="228.7" width="42.7" height="135.3" fill="#286c93"/>
<text x="488.6" y="385.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="400" fill="#334155">210–239</text>
<rect x="528.0" y="216.6" width="42.7" height="147.4" fill="#286c93"/>
<rect x="588.7" y="224.7" width="42.7" height="139.3" fill="#286c93"/>
<rect x="649.4" y="232.6" width="42.7" height="131.4" fill="#286c93"/>
<text x="670.8" y="385.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="400" fill="#334155">300–329</text>
<rect x="710.1" y="240.1" width="42.7" height="123.9" fill="#286c93"/>
<rect x="770.9" y="231.0" width="42.7" height="133.0" fill="#286c93"/>
<rect x="831.6" y="232.3" width="42.7" height="131.7" fill="#286c93"/>
<rect x="892.3" y="244.9" width="42.7" height="119.1" fill="#286c93"/>
<text x="913.6" y="385.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="400" fill="#334155">420–449</text>
<text x="519.0" y="419.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="400" fill="#334155">Days since first purchase (each bar covers 30 days)</text>
<text x="94.0" y="456.0" text-anchor="start" font-family="Arial,sans-serif" font-size="12" font-weight="400" fill="#475569">Each rate = purchasers in window / 23,570 original customers; all windows have full follow-up.</text>
</svg>
